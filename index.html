<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mobile Wars - Interactive Business Simulation</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a1a2e'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='%23E8B4A0'%3E📱%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/styles.css?v=1769249921">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <!-- Metrics Bar -->
    <div id="metrics-bar" class="metrics-bar">
        <div class="metric-detail clickable" id="progress-trigger" role="button" tabindex="0" aria-label="View journey progress">
            <span class="metric-label">DATE</span>
            <span class="metric-value">
                <span id="date-metric">JAN 2007</span>
                <span class="progress-badge" id="progress-badge" title="Decisions made - Click to view journey">0/6</span>
            </span>
        </div>
        <div class="metric-detail clickable" id="pl-trigger" role="button" tabindex="0" aria-label="View P&L breakdown">
            <span class="metric-label">MOBILE P&L <i class="ph ph-info" style="font-size: 0.7rem; opacity: 0.6;"></i></span>
            <span class="metric-value" id="pl-metric">+$400M</span>
            <!-- P&L Breakdown Popup -->
            <div class="pl-breakdown-popup" id="pl-breakdown-popup">
                <div class="pl-breakdown-item">
                    <span class="pl-label">Revenue</span>
                    <span class="pl-value positive" id="pl-revenue">$800M</span>
                </div>
                <div class="pl-breakdown-divider"></div>
                <div class="pl-breakdown-item">
                    <span class="pl-label">Costs</span>
                    <span class="pl-value negative" id="pl-costs">$400M</span>
                </div>
            </div>
        </div>
        <div class="metric-detail">
            <span class="metric-label">MARKET SHARE</span>
            <span class="metric-value" id="share-metric">42%</span>
        </div>

        <!-- Profile Icon -->
        <button id="profile-icon-btn" class="profile-icon-btn" aria-label="View Profile">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
                <path d="M5 20c0-4 3-7 7-7s7 3 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>

        <!-- Progress Bar (thin line at bottom of metrics bar) -->
        <div class="progress-bar-container" id="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
    </div>

    <!-- Main Content Container -->
    <main id="main-content" class="main-content">
        <!-- Content will be dynamically inserted here -->
    </main>

    <!-- Artifact Collection Button (Bottom Left Corner) -->
    <button id="artifact-toggle-btn" class="artifact-toggle-btn">
        <div class="artifact-icon"><i class="ph ph-trophy"></i></div>
        <div class="artifact-count-badge" id="artifact-count">0</div>
    </button>

    <!-- Artifact Collection Modal -->
    <div id="artifact-modal-collection" class="modal artifact-collection-modal hidden">
        <div class="artifact-collection-content">
            <div class="artifact-collection-header">
                <h2>Artifact Collection</h2>
                <button class="modal-close" id="artifact-collection-close">✕</button>
            </div>
            <div class="artifact-collection-grid" id="artifact-collection-grid">
                <!-- Artifact cards will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Bottom Action Bar -->
    <div id="action-bar" class="action-bar hidden">
        <button id="back-btn" class="action-btn">◄ Back</button>
        <button id="progress-btn" class="action-btn">Progress</button>
        <button id="share-btn" class="action-btn">Share</button>
    </div>

    <!-- Modal for Information Cards -->
    <div id="card-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <button class="modal-close" id="modal-close">✕</button>
            </div>
            <div id="modal-body" class="modal-body">
                <!-- Card content will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Action Modal (Take Action) -->
    <div id="action-modal" class="modal action-modal hidden">
        <div class="action-modal-container" id="action-modal-content">
            <!-- Action options will be inserted here -->
        </div>
    </div>

    <!-- Artifact Viewer Modal -->
    <div id="artifact-modal" class="modal artifact-modal hidden">
        <div class="artifact-modal-content">
            <button class="modal-close" id="artifact-modal-close">✕</button>
            <div id="artifact-viewer" class="artifact-viewer">
                <!-- Artifact 3D view and details will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal profile-modal hidden">
        <div class="profile-modal-content">
            <div class="profile-modal-header">
                <h2>Leadership Profile</h2>
                <button class="modal-close" id="profile-modal-close">✕</button>
            </div>
            <div class="profile-modal-body" id="profile-modal-body">
                <!-- Profile content will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Journey/Progress Modal -->
    <div id="journey-modal" class="modal journey-modal hidden">
        <div class="journey-modal-content">
            <div class="journey-modal-header">
                <h2>Your Journey</h2>
                <button class="modal-close" id="journey-modal-close">✕</button>
            </div>
            <div class="journey-modal-body" id="journey-modal-body">
                <!-- Journey timeline will be inserted here -->
            </div>
        </div>
    </div>

    <script src="js/data.js?v=1769249921"></script>
    <script src="js/state.js?v=1769249921"></script>
    <script src="js/artifacts.js?v=1769249921"></script>
    <script src="js/transitions.js?v=1769249921"></script>
    <script src="js/feedback.js?v=1769249921"></script>
    <script src="js/analytics.js?v=1769249921"></script>
    <script src="js/ui.js?v=1769249921"></script>
    <script src="js/app.js?v=1769249921"></script>
</body>
</html>
